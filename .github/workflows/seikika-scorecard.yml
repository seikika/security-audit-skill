name: Seikika repository scorecard

on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:

permissions: {contents: read}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: seikika/seikika/actions/report@a732b573ce8715197e637dc151d92d3daa1f88ef # v0.2.1
        with: {seikika-version: 0.2.1, mode: ci}
